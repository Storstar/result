[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factorycontent-mvp"
version = "0.1.0"
description = "Backend-first MVP for turning app demo recordings into structured creative artifacts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "imageio-ffmpeg>=0.5.1",
  "numpy>=1.26.4",
  "opencv-python-headless>=4.10.0.84",
  "openai>=1.75.0",
  "pillow>=10.4.0",
  "pydantic>=2.9.2",
  "pydantic-settings>=2.5.2",
  "python-dotenv>=1.0.1",
  "python-telegram-bot>=21.6",
  "rapidocr-onnxruntime>=1.3.24",
]

[project.scripts]
factorycontent = "factorycontentselling.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

